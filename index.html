
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<table> 
    <caption>Horario de 1º DAW</caption>
    <tr>
        <th>Hora</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
    </tr>

<!-- Primera hora -->
<tr>
    <th>15:30 - 16:25</th>
</tr>

<!-- Segunda hora -->
<tr>
    <th>16:25 - 17:20</th>
</tr>

<!-- Tercera hora -->
<tr>
    <th>17:20 - 18:15</th>
</tr>

<!-- Recreo -->
<tr>
    <th>18:15 - 18:35</th>
</tr>

<!-- Cuarta hora -->
<tr>
    <th>18:35 - 19:30</th>
</tr>

<!-- Quinta hora -->
<tr>
    <th>19:30 - 20:25</th>
</tr>

<!-- Sexta hora -->
<tr>
    <th>20:25 - 21:15</th>
</tr>

<!-- Séptima hora -->
<tr>
    <th>21:15 - 22:05</th>
</tr>

</table>
</body>
</html>
